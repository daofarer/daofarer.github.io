<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>道行天涯 ARPG 设计文档</title>

  <style>
    :root {
      --bg: #0d1111;
      --panel: #121817;
      --panel-2: #171f1d;
      --paper: rgba(255, 255, 255, 0.06);
      --paper-strong: rgba(255, 255, 255, 0.1);
      --text: #f2ead7;
      --muted: #b2b8aa;
      --soft: #889184;
      --line: rgba(242, 234, 215, 0.13);
      --gold: #d6a84f;
      --jade: #2dd4bf;
      --blue: #60a5fa;
      --green: #22c55e;
      --orange: #f59e0b;
      --red: #ef4444;
      --radius: 12px;
      --max: 1120px;
      --sidebar-width: 248px;
      --mobile-header-height: 0px;
      --toolbar-wrap-height: 75px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      scroll-behavior: smooth;
      overscroll-behavior-y: none;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.026) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(180deg, #111615 0%, #0d1111 42%, #090d0d 100%);
      background-size: 44px 44px, 44px 44px, auto;
      background-color: var(--bg);
      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(100% - 56px, var(--max));
      margin: 0 auto;
    }

    .desktop-shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: 100vh;
    }

    .desktop-sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 24px 18px;
      border-right: 1px solid var(--line);
      background: rgba(10, 14, 14, 0.94);
      backdrop-filter: blur(14px);
      box-shadow: 18px 0 46px rgba(0, 0, 0, 0.18);
    }

    .main-content {
      min-width: 0;
      background: rgba(255, 255, 255, 0.012);
    }

    .brand {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(242, 234, 215, 0.09);
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgba(214, 168, 79, 0.38);
      border-radius: 10px;
      color: var(--gold);
      background: rgba(214, 168, 79, 0.12);
      font-size: 24px;
    }

    .brand-title {
      margin: 0;
      font-size: 19px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .brand-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .progress-card {
      margin-bottom: 24px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.045);
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--gold), var(--jade));
      transition: width 260ms ease;
    }

    .side-title {
      margin: 24px 0 10px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .desktop-toc {
      display: grid;
      gap: 4px;
    }

    .desktop-toc a {
      display: block;
      padding: 9px 10px 9px 12px;
      border-left: 2px solid transparent;
      border-radius: 8px;
      color: #d8d0bd;
      font-size: 14px;
      line-height: 1.35;
    }

    .desktop-toc a:hover,
    .desktop-toc a.active {
      color: var(--text);
      border-left-color: var(--gold);
      background: rgba(214, 168, 79, 0.11);
    }

    .mobile-header {
      display: none;
    }

    .mobile-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 58px;
      padding-right: 12px;
    }

    .mobile-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1 1 auto;
      padding: 10px 14px 9px;
    }

    .mobile-brand .brand-mark {
      width: 38px;
      height: 38px;
      font-size: 20px;
    }

    .mobile-brand strong {
      display: block;
      font-size: 16px;
      line-height: 1.25;
    }

    .mobile-brand small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .mobile-toc {
      position: absolute;
      top: calc(100% + 1px);
      right: 8px;
      left: 8px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      max-height: min(68vh, 520px);
      padding: 10px;
      overflow-y: auto;
      overscroll-behavior: contain;
      border: 1px solid var(--line);
      border-radius: 0 0 12px 12px;
      background: rgba(7, 11, 11, 0.98);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.42);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 150ms ease, transform 150ms ease, visibility 150ms ease;
    }

    .mobile-header.menu-open .mobile-toc {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }

    .mobile-toc a {
      display: block;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #eadfc7;
      background: rgba(255, 255, 255, 0.045);
      font-size: 12px;
      line-height: 1.35;
      white-space: normal;
    }

    .mobile-toc a.active {
      color: #0d1111;
      border-color: transparent;
      background: linear-gradient(135deg, var(--gold), var(--jade));
    }

    .mobile-menu-toggle {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 0 11px;
      border: 1px solid rgba(214, 168, 79, 0.28);
      border-radius: 8px;
      color: #f0e5cc;
      background: rgba(214, 168, 79, 0.09);
      cursor: pointer;
      font-size: 13px;
      font-weight: 900;
    }

    .mobile-menu-toggle::after {
      display: inline-block;
      margin-left: 6px;
      content: "⌄";
      transition: transform 150ms ease;
    }

    .mobile-header.menu-open .mobile-menu-toggle::after {
      transform: rotate(180deg);
    }

    .hero {
      padding: 38px 0 26px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.018);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--jade);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero h1 {
      max-width: 1000px;
      margin: 0 0 14px;
      font-size: clamp(34px, 4.8vw, 58px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .hero-desc {
      max-width: 960px;
      margin: 0 0 18px;
      color: #e8ddc7;
      font-size: clamp(16px, 1.8vw, 19px);
      line-height: 1.85;
    }

    .meta-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .meta-pill {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #efe2c5;
      background: rgba(255, 255, 255, 0.045);
      font-size: 13px;
    }

    .toolbar-wrap {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(13, 17, 17, 0.92);
      backdrop-filter: blur(14px);
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.18);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
    }

    .search {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.065);
    }

    .search:focus {
      border-color: var(--jade);
    }

    .filter-btn {
      height: 42px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.07);
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-btn.active {
      border-color: rgba(245, 158, 11, 0.7);
      background: rgba(245, 158, 11, 0.14);
      color: #fcd34d;
    }

    .document {
      padding: 32px 0 42px;
    }

    .chapter {
      margin-bottom: 48px;
      scroll-margin-top: 92px;
    }

    .chapter-head {
      margin-bottom: 18px;
      padding: 18px 20px;
      border: 1px solid rgba(242, 234, 215, 0.12);
      border-left: 4px solid var(--gold);
      border-radius: var(--radius);
      background: rgba(12, 18, 18, 0.76);
    }

    .chapter-index {
      color: var(--gold);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .chapter h2 {
      margin: 7px 0 10px;
      font-size: clamp(28px, 3.6vw, 42px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .chapter-description {
      max-width: 980px;
      margin: 0;
      color: var(--muted);
      line-height: 1.85;
      font-size: 15px;
    }

    .section-list {
      display: grid;
      gap: 18px;
    }

    .section-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 18px;
    }

    .section-tab {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #eadfc7;
      background: rgba(255, 255, 255, 0.045);
      cursor: pointer;
      font-weight: 800;
      font-size: 13px;
      line-height: 1.25;
    }

    .section-tab:hover {
      border-color: rgba(214, 168, 79, 0.48);
      background: rgba(214, 168, 79, 0.1);
    }

    .section-tab.active {
      color: #0d1111;
      border-color: transparent;
      background: linear-gradient(135deg, var(--gold), var(--jade));
    }

    .section-tab.is-filtering {
      color: #d8d0bd;
      border-color: rgba(242, 234, 215, 0.12);
      background: rgba(255, 255, 255, 0.04);
    }

    .doc-section {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(17, 24, 22, 0.82);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.18);
    }

    .section-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.045);
    }

    .section-head h3 {
      margin: 0 0 6px;
      font-size: 21px;
      letter-spacing: 0;
      line-height: 1.35;
    }

    .section-head p {
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
      font-size: 14px;
    }

    .field-row {
      padding: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.075);
    }

    .field-row:first-child {
      border-top: 0;
    }

    .field-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 9px;
    }

    .field-label {
      color: #f0e5cc;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.4;
    }

    .field-guide {
      display: inline-block;
      max-width: 100%;
      margin-bottom: 12px;
      padding: 6px 9px;
      border: 1px solid rgba(45, 212, 191, 0.16);
      border-radius: 8px;
      color: #a9cfc7;
      background: rgba(45, 212, 191, 0.055);
      font-size: 13px;
      line-height: 1.65;
    }

    .status {
      flex: 0 0 auto;
      width: fit-content;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 900;
    }

    .status.todo {
      color: #fde68a;
      background: rgba(245, 158, 11, 0.16);
    }

    .status.draft {
      color: #bfdbfe;
      background: rgba(96, 165, 250, 0.16);
    }

    .status.done {
      color: #bbf7d0;
      background: rgba(34, 197, 94, 0.16);
    }

    .field-content {
      max-width: 980px;
      padding: 14px 16px;
      border: 1px solid rgba(242, 234, 215, 0.1);
      border-left: 3px solid rgba(214, 168, 79, 0.62);
      border-radius: 10px;
      color: #e1d7c3;
      background: rgba(4, 7, 7, 0.22);
      line-height: 2.05;
      font-size: 15px;
      white-space: pre-line;
    }

    .field-row.todo .field-content {
      color: #8f998d;
      font-style: italic;
    }

    .reward-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      max-width: 980px;
      margin-top: 14px;
    }

    .reward-item {
      min-height: 72px;
      padding: 11px 12px;
      border: 1px solid rgba(242, 234, 215, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.042);
    }

    .reward-label {
      margin-bottom: 5px;
      color: #f5d38d;
      font-size: 12px;
      font-weight: 900;
    }

    .reward-value {
      color: #d9d1bf;
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-line;
    }

    .reward-value.empty {
      color: #8f998d;
      font-style: italic;
    }

    .dialogue-list {
      display: grid;
      gap: 10px;
      max-width: 980px;
      margin-top: 16px;
    }

    .dialogue-line {
      display: flex;
      width: 100%;
    }

    .dialogue-line.protagonist {
      justify-content: flex-end;
    }

    .dialogue-line.npc {
      justify-content: flex-start;
    }

    .dialogue-line.narration {
      justify-content: center;
    }

    .dialogue-bubble {
      max-width: min(74%, 760px);
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: #eadfc9;
      line-height: 1.85;
      white-space: pre-line;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
    }

    .dialogue-line.protagonist .dialogue-bubble {
      width: min(74%, 760px);
      border-right: 3px solid rgba(45, 212, 191, 0.86);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(20, 184, 166, 0.09);
    }

    .dialogue-line.npc .dialogue-bubble {
      border-left: 3px solid rgba(245, 158, 11, 0.86);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(245, 158, 11, 0.09);
    }

    .dialogue-line.narration .dialogue-bubble {
      max-width: min(86%, 860px);
      text-align: center;
      border-color: rgba(255, 255, 255, 0.16);
      background: rgba(8, 12, 12, 0.52);
      color: #c8d0c4;
    }

    .dialogue-speaker {
      margin-bottom: 4px;
      color: #f5d38d;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .dialogue-line.protagonist .dialogue-speaker {
      color: #7dd3fc;
      text-align: left;
    }

    .dialogue-text {
      font-size: 14px;
      line-height: 1.85;
    }

    .task-segment-list {
      display: grid;
      gap: 16px;
      max-width: 1080px;
      margin-top: 16px;
    }

    .task-segment {
      overflow: hidden;
      border: 1px solid rgba(214, 168, 79, 0.22);
      border-radius: 12px;
      background: rgba(4, 7, 7, 0.3);
    }

    .task-segment-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(214, 168, 79, 0.07);
    }

    .task-segment-index {
      color: #d6a84f;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .task-segment-title {
      margin-top: 3px;
      color: #f0e5cc;
      font-size: 16px;
      font-weight: 900;
    }

    .task-segment-id {
      color: #809087;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }

    .task-segment-body {
      padding: 14px 15px 16px;
    }

    .task-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .task-meta-item {
      padding: 9px 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.035);
    }

    .task-meta-label {
      margin-bottom: 3px;
      color: #91bdb4;
      font-size: 11px;
      font-weight: 900;
    }

    .task-meta-value {
      color: #d9d1bf;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .task-segment-content {
      color: #ddd4c1;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .task-structure-empty {
      max-width: 980px;
      margin-top: 14px;
      padding: 13px 15px;
      border: 1px dashed rgba(45, 212, 191, 0.28);
      border-radius: 10px;
      color: #8eaaa3;
      background: rgba(45, 212, 191, 0.035);
      font-size: 13px;
      line-height: 1.7;
    }

    .dialogue-node {
      padding: 13px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.028);
    }

    .dialogue-node + .dialogue-node {
      margin-top: 10px;
    }

    .dialogue-node-id {
      margin-bottom: 7px;
      color: #77867f;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
    }

    .dialogue-choices {
      display: grid;
      gap: 8px;
      margin-top: 11px;
      padding-left: 22px;
    }

    .dialogue-choice {
      position: relative;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(45, 212, 191, 0.2);
      border-radius: 8px;
      background: rgba(20, 184, 166, 0.055);
      color: inherit;
      text-align: left;
      cursor: pointer;
      font: inherit;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .dialogue-choice:hover,
    .dialogue-choice:focus-visible {
      border-color: rgba(94, 234, 212, 0.58);
      background: rgba(20, 184, 166, 0.12);
      transform: translateX(2px);
      outline: none;
    }

    .dialogue-choice::before {
      position: absolute;
      left: -22px;
      top: 9px;
      color: #5eead4;
      content: "›";
      font-size: 20px;
      font-weight: 900;
    }

    .dialogue-choice-text {
      color: #dff7f2;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.65;
    }

    .choice-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }

    .choice-tag {
      padding: 3px 7px;
      border-radius: 999px;
      color: #c9d4ce;
      background: rgba(255, 255, 255, 0.08);
      font-size: 11px;
      line-height: 1.45;
    }

    .choice-tag.requirement { color: #fde68a; background: rgba(245, 158, 11, 0.13); }
    .choice-tag.reward { color: #bbf7d0; background: rgba(34, 197, 94, 0.13); }
    .choice-tag.result { color: #bfdbfe; background: rgba(96, 165, 250, 0.13); }
    .choice-tag.next { color: #e9d5ff; background: rgba(168, 85, 247, 0.13); }

    .dialogue-node[hidden] {
      display: none;
    }

    .dialogue-branch-result {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(96, 165, 250, 0.2);
      border-radius: 8px;
      color: #ced9e8;
      background: rgba(96, 165, 250, 0.07);
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .dialogue-branch-result.visible {
      display: block;
    }

    .dialogue-history {
      display: grid;
      gap: 6px;
      margin-bottom: 10px;
    }

    .dialogue-history-item {
      width: fit-content;
      max-width: 78%;
      padding: 7px 9px;

      font-size: 12px;
      font-weight: 800;

    .empty-state {
      padding: 28px;

      border-radius: var(--radius);

      font-weight: 800;

    .relation-table-card,
    .chain-card {

      border-radius: var(--radius);

      color: #f0e5cc;
      font-size: 21px;
      letter-spacing: 0;

      color: var(--muted);
      line-height: 1.75;
    }

      color: var(--jade);
      font-size: 13px;
      font-weight: 900;

      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

      display: inline-flex;
      align-items: center;

      padding: 0 9px;
      border-radius: 8px;
      color: #dce8df;
      background: rgba(255, 255, 255, 0.07);

      background: rgba(214, 168, 79, 0.14);

    .relation-tag.green {
      color: #bbf7d0;
      background: rgba(34, 197, 94, 0.14);
    }

    .relation-tag.red {
      color: #fecaca;
      background: rgba(239, 68, 68, 0.14);
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .relation-table-card h3 {
      padding: 20px 20px 0;
    }

    .relation-table-card > p {
      padding: 0 20px;
      color: var(--muted);
      line-height: 1.7;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }

    th,
    td {
      padding: 13px 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
      vertical-align: top;
      line-height: 1.6;
    }

    th {
      color: #f0e5cc;
      background: rgba(255, 255, 255, 0.04);
      font-size: 13px;
    }

    td {
      color: #d6cbb7;
      font-size: 14px;
    }

    .chain-card {
      padding: 20px;
    }

    .chain-flow {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .chain-step {
      position: relative;
      padding: 14px 16px;
      border: 1px solid rgba(246, 240, 223, 0.12);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.045);
      color: #d6cbb7;
      line-height: 1.7;
    }

    .chain-step::after {
      content: "↓";
      display: block;
      margin-top: 8px;
      color: var(--gold);
      font-weight: 900;
    }

    .chain-step:last-child::after {
      content: "";
      display: none;
    }

    .rule-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.045);
    }

    .rule-card h4 {
      margin: 0 0 10px;
      color: #f0e5cc;
      font-size: 17px;
    }

    .rule-line {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      color: #d6cbb7;
      line-height: 1.65;
      font-size: 14px;
    }

    .rule-line:first-of-type {
      border-top: 0;
    }

    .rule-line strong {
      color: var(--muted);
      font-weight: 800;
    }

    .footer {
      padding: 32px 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 1000px) {
      .relation-grid,
      .relation-grid.three {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .mobile-header {
        position: sticky;
        top: 0;
        z-index: 50;
        display: block;
        border-bottom: 1px solid var(--line);
        background: rgba(5, 8, 9, 0.9);
        backdrop-filter: blur(18px);
      }

      .desktop-shell {
        display: block;
      }

      .desktop-sidebar {
        display: none;
      }

      .toolbar-wrap {
        top: var(--mobile-header-height);
      }

      .hero {
        padding-top: 30px;
      }

      .chapter {
        scroll-margin-top: calc(var(--mobile-header-height) + var(--toolbar-wrap-height) + 18px);
      }
    }

    @media (max-width: 640px) {
      .container {
        width: min(100% - 24px, var(--max));
      }

      .hero {
        padding-top: 24px;
      }

      .hero h1 {
        font-size: 31px;
      }

      .hero-desc {
        font-size: 15px;
        line-height: 1.75;
      }

      .toolbar {
        flex-wrap: wrap;
        gap: 8px;
      }

      .search {
        flex-basis: 100%;
        min-width: 0;
      }

      .filter-btn {
        flex: 1 1 auto;
        padding: 0 11px;
      }

      .toolbar-wrap {
        top: var(--mobile-header-height);
      }

      .field-top {
        flex-direction: column;
      }

      .status {
        order: -1;
      }

      .chapter-head {
        padding: 16px;
      }

      .chapter h2 {
        font-size: 27px;
      }

      .section-head,
      .field-row {
        padding: 18px;
      }

      .field-content {
        padding: 13px 14px;
        font-size: 14px;
        line-height: 1.95;
      }

      .reward-grid {
        grid-template-columns: 1fr;
      }

      .task-meta-grid {
        grid-template-columns: 1fr;
      }

      .task-segment-head {
        flex-direction: column;
      }

      .dialogue-choices {
        padding-left: 17px;
      }

      .dialogue-choice::before {
        left: -17px;
      }

      .dialogue-bubble,
      .dialogue-line.narration .dialogue-bubble {
        max-width: 100%;
      }

      .dialogue-line.protagonist .dialogue-bubble,
      .dialogue-history-item.protagonist {
        width: 100%;
        max-width: 100%;
      }

      .relation-card,
      .chain-card {
        padding: 18px;
      }

      .rule-line {
        grid-template-columns: 1fr;
        gap: 2px;
      }
    }

    @media (max-width: 420px) {
      .mobile-brand small {
        display: none;
      }

      .mobile-toc {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <script>
    const GAME_DOCUMENT = {
      project: {
        name: "道行天涯 ARPG",
        subtitle: "中国古代道教背景 · 降妖除魔 · 多路线单机 ARPG",

          "核心关键词：降妖除魔、因果声望、NPC 态度、多结局",
          "当前阶段：世界观与系统框架搭建"
        ],
        lastUpdated: "2026-05-22"
      },

      chapters: [
        {

          index: "01",

          sections: [
            {
              title: "游戏一句话概念",

                {

                {
                  label: "玩家身份",

                  status: "draft",
                  value: "主角是被爷爷收养、后由师姐引入道门的年轻修行者。表面身份是游方小道士，真实身世与某个被封存的因果有关，因此能感知妖气、残魂与誓约裂痕。"

                {
                  label: "核心卖点",
                  guide: "写 3 到 5 个最重要的卖点。",

                  value: "1. 中国古代道教与志怪背景。\n2. 多路线解决任务，不只有战斗一种方式。\n3. 玩家行为会持续影响 NPC 态度、村镇声望和门派评价。\n4. 妖魔不只是怪物，也可能被度化、说服、利用、交易或放逐等。"

            }
          ]
        },

        {
          id: "core-experience",
          index: "02",
          title: "界面操作",
          description: "这一章决定游戏长期方向。后面所有系统都应该服务这些原则。",
          sections: [
            {
              title: "核心设计支柱",
              description: "建议固定 4 到 6 条，不要太多。",
              fields: [
                {
                  label: "支柱一：多解法任务",
                  guide: "每个重要任务至少允许 2 到 4 种解决方式。",
                  status: "draft",

                      第二十三章

                      第二十五章

                  知人者智，自知者明。胜人者有力，自胜者强。知足者富。强行者有志。不失其所者久。死而不亡者寿。
                      第三十四章
                  大道泛兮，其可左右。万物恃之以生而不辞，功成而不名有。衣养万物而不为主，常无欲，可名于小矣；万物归焉而不为主，可名于大矣。是以圣人终不为大，故能成其大。
                      第三十五章
                  执大象，天下往。往而不害，安平泰。乐与饵，过客止。道之出口，淡乎其无味，视之不足见，听之不足闻，用之不可既。
                      第三十六章
                  将欲歙之，必固张之；将欲弱之，必固强之；将欲废之，必固兴之；将欲取之，必固与之。是谓微明。柔弱胜刚强。鱼不可脱于渊，国之利器不可以示人。
                      第三十七章
                  道常无为而无不为。侯王若能守之，万物将自化。化而欲作，吾将镇之以无名之朴。无名之朴，亦将不欲。不欲以静，天下将自正。
                      第三十八章
                  上德不德，是以有德；下德不失德，是以无德。上德无为而无以为，下德无为而有以为。上仁为之而无以为，上义为之而有以为。上礼为之而莫之应，则攘臂而扔之。故失道而后德，失德而后仁，失仁而后义，失义而后礼。夫礼者，忠信之薄，而乱之首。前识者，道之华，而愚之始。是以大丈夫处其厚，不处其薄；居其实，不居其华。故去彼取此。
                      第三十九章
                  昔之得一者：天得一以清，地得一以宁，神得一以灵，谷得一以盈，万物得一以生，侯王得一以为天下正。其致之，天无以清，将恐裂；地无以宁，将恐发；神无以灵，将恐歇；谷无以盈，将恐竭；万物无以生，将恐灭；侯王无以贵高，将恐蹶。故贵必以贱为本，高必以下为基。是以侯王自谓孤、寡、不毂。此其以贱为本耶？非乎？故致数车无车。不欲琭琭如玉，落落如石。
                      第四十章
                  反者道之动，弱者道之用。天下万物生于有，有生于无。
                      第四十一章
                  上士闻道，勤而行之；中士闻道，若存若亡；下士闻道，大笑之。不笑，不足以为道。故建言有之：明道若昧，进道若退，夷道若类，上德若谷，大白若辱，广德若不足，建德若偷，质真若渝，大方无隅，大器晚成，大音希声，大象无形，道隐无名。夫唯道，善贷且成。
                      第四十二章
                  道生一，一生二，二生三，三生万物。万物负阴而抱阳，冲气以为和。人之所恶，唯孤、寡、不毂，而王公以为称。故物或损之而益，或益之而损。人之所教，我亦教之。强梁者不得其死，吾将以为教父。
                      第四十三章
                  天下之至柔，驰骋天下之至坚。无有入无间。吾是以知无为之有益。不言之教，无为之益，天下希及之。
                      第四十四章
                  名与身孰亲？身与货孰多？得与亡孰病？甚爱必大费，多藏必厚亡。知足不辱，知止不殆，可以长久。
                      第四十五章
                  大成若缺，其用不弊。大盈若冲，其用不穷。大直若屈，大巧若拙，大辩若讷。躁胜寒，静胜热。清静以为天下正。
                      第四十六章
                  天下有道，却走马以粪。天下无道，戎马生于郊。罪莫大于可欲，祸莫大于不知足，咎莫大于欲得。故知足之足，常足矣。
                      第四十七章
                  不出户，知天下；不窥牖，见天道。其出弥远，其知弥少。是以圣人不行而知，不见而名，不为而成。
                      第四十八章
                  为学日益，为道日损。损之又损，以至于无为。无为而无不为。取天下常以无事，及其有事，不足以取天下。
                      第四十九章
                  圣人常无心，以百姓心为心。善者吾善之，不善者吾亦善之，德善。信者吾信之，不信者吾亦信之，德信。圣人在天下怵怵，为天下浑其心。百姓皆注其耳目，圣人皆孩之。
                      第五十章
                  出生入死。生之徒，十有三；死之徒，十有三；人之生，动之死地，十有三。夫何故？以其生生之厚也。盖闻善摄生者，路行不遇兕虎，入军不被甲兵。兕无所投其角，虎无所措其爪，兵无所容其刃。夫何故？以其无死地。
                      第五十一章
                  道生之，德畜之，物形之，势成之。是以万物莫不尊道而贵德。道之尊，德之贵，夫莫之命而常自然。故道生之，德畜之；长之育之，成之熟之，养之覆之。生而不有，为而不恃，长而不宰。是谓玄德。
                      第五十二章
                  天下有始，以为天下母。既知其母，复知其子。既知其子，复守其母，没身不殆。塞其兑，闭其门，终身不勤。开其兑，济其事，终身不救。见小曰明，守柔曰强。用其光，复归其明，无遗身殃，是谓习常。
                      第五十三章
                  使我介然有知，行于大道，唯施是畏。大道甚夷，而民好径。朝甚除，田甚芜，仓甚虚；服文采，带利剑，厌饮食，财货有馀；是谓盗夸。盗夸非道也哉！
                      第五十四章
                  善建者不拔，善抱者不脱，子孙以祭祀不辍。修之于身，其德乃真；修之于家，其德乃馀；修之于乡，其德乃长；修之于国，其德乃丰；修之于天下，其德乃普。故以身观身，以家观家，以乡观乡，以国观国，以天下观天下。吾何以知天下之然哉？以此。
                      第五十五章
                  含德之厚，比于赤子。毒虫不螫，猛兽不据，攫鸟不搏。骨弱筋柔而握固，未知牝牡之合而朘作，精之至也。终日号而不嗄，和之至也。知和曰常，知常曰明。益生曰祥，心使气曰强。物壮则老，谓之不道，不道早已。
                      第五十六章
                  知者不言，言者不知。塞其兑，闭其门，挫其锐，解其纷，和其光，同其尘，是谓玄同。故不可得而亲，亦不可得而疏；不可得而利，亦不可得而害；不可得而贵，亦不可得而贱。故为天下贵。
                      第五十七章
                  以正治国，以奇用兵，以无事取天下。吾何以知其然哉？以此：天下多忌讳，而民弥贫；民多利器，国家滋昏；人多伎巧，奇物滋起；法物滋彰，盗贼多有。故圣人云：我无为而民自化，我好静而民自正，我无事而民自富，我无欲而民自朴，我无情而民自清。
                      第五十八章
                  其政闷闷，其民淳淳；其政察察，其民缺缺。祸兮福之所倚，福兮祸之所伏。孰知其极？其无正。正复为奇，善复为妖。人之迷，其日固久。是以圣人方而不割，廉而不刿，直而不肆，光而不耀。
                      第五十九章
                  治人事天，莫若啬。夫唯啬，是谓早服。早服谓之重积德。重积德则无不克。无不克则莫知其极。莫知其极，可以有国。有国之母，可以长久。是谓深根固蒂，长生久视之道。
                      第六十章
                  治大国，若烹小鲜。以道莅天下，其鬼不神。非其鬼不神，其神不伤人；非其神不伤人，圣人亦不伤人。夫两不相伤，故德交归焉。
                      第六十一章
                  大国者下流，天下之交，天下之牝。牝常以静胜牡，以静为下。故大国以下小国，则取小国；小国以下大国，则取大国。故或下以取，或下而取。大国不过欲兼畜人，小国不过欲入事人。夫两者各得其所欲，大者宜为下。
                      第六十二章
                  道者万物之奥。善人之宝，不善人之所保。美言可以市，尊行可以加人。人之不善，何弃之有？故立天子，置三公，虽有拱璧以先驷马，不如坐进此道。古之所以贵此道者何？不日求以得，有罪以免耶？故为天下贵。
                      第六十三章
                  为无为，事无事，味无味。大小多少，报怨以德。图难于其易，为大于其细。天下难事，必作于易；天下大事，必作于细。是以圣人终不为大，故能成其大。夫轻诺必寡信，多易必多难。是以圣人犹难之，故终无难矣。
                      第六十四章
                  其安易持，其未兆易谋，其脆易破，其微易散。为之于未有，治之于未乱。合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。为者败之，执者失之。民之从事，常于几成而败之。慎终如始，则无败事。是以圣人欲不欲，不贵难得之货；学不学，复众人之所过。以辅万物之自然，而不敢为。
                      第六十五章
                  古之善为道者，非以明民，将以愚之。民之难治，以其智多。以智治国，国之贼；不以智治国，国之福。知此两者亦楷式。能知楷式，是谓玄德。玄德深矣，远矣，与物反矣，然后乃至大顺。
                      第六十六章
                  江海所以能为百谷王者，以其善下之，故能为百谷王。是以圣人欲上民，必以言下之；欲先民，必以身后之。是以圣人处上而民不重，处前而民不害。是以天下乐推而不厌。以其不争，故天下莫能与之争。
                      第六十七章

                      第六十八章
                  善为士者不武，善战者不怒，善胜敌者不与争，善用人者为之下。是谓不争之德，是谓用人之力，是谓配天，古之极。
                      第六十九章
                  用兵有言：吾不敢为主而为客，不敢进寸而退尺。是谓行无行，攘无臂，扔无敌，执无兵。祸莫大于轻敌，轻敌几丧吾宝。故抗兵相加，哀者胜矣。
                      第七十章
                  吾言甚易知，甚易行。天下莫能知，莫能行。言有宗，事有君。夫唯无知，是以不我知。知我者希，则我者贵。是以圣人被褐怀玉。
                      第七十一章
                  知不知，上；不知知，病。夫唯病病，是以不病。圣人不病，以其病病，是以不病。
                      第七十二章
                  民不畏威，则大威至。无狭其所居，无厌其所生。夫唯不厌，是以不厌。是以圣人自知不自见，自爱不自贵。故去彼取此。
                      第七十三章
                  勇于敢则杀，勇于不敢则活。此两者，或利或害。天之所恶，孰知其故？天之道，不争而善胜，不言而善应，不召而自来，繟然而善谋。天网恢恢，疏而不失。
                      第七十四章
                  民不畏死，奈何以死惧之？若使民常畏死，而为奇者，吾得执而杀之，孰敢？常有司杀者。夫代司杀者，是谓代大匠斫。夫代大匠斫者，希有不伤其手矣。
                      第七十五章
                  民之饥，以其上食税之多，是以饥。民之难治，以其上之有为，是以难治。民之轻死，以其上求生之厚，是以轻死。夫唯无以生为者，是贤于贵生。
                      第七十六章
                  人之生也柔弱，其死也坚强。万物草木之生也柔脆，其死也枯槁。故坚强者死之徒，柔弱者生之徒。是以兵强则不胜，木强则共。强大处下，柔弱处上。
                      第七十七章
                  天之道，其犹张弓乎？高者抑之，下者举之；有馀者损之，不足者补之。天之道，损有馀而补不足。人之道则不然，损不足以奉有馀。孰能有馀以奉天下，唯有道者。是以圣人为而不恃，功成而不处，其不欲见贤。
                      第七十八章
                  天下莫柔弱于水，而攻坚强者莫之能胜，以其无以易之。柔之胜刚，弱之胜强，天下莫不知，莫能行。是以圣人云：受国之垢，是谓社稷主；受国不祥，是谓天下王。正言若反。
                      第七十九章
                  和大怨，必有馀怨，安可以为善？是以圣人执左契，而不责于人。有德司契，无德司彻。天道无亲，常与善人。
                      第八十章
                  小国寡民。使有什伯，人之器而不用。使民重死而不远徙。虽有舟舆，无所乘之，虽有甲兵，无所陈之。使民复结绳而用之。甘其食，美其服，安其居，乐其俗。邻国相望，鸡犬之声相闻，民至老死，不相往来。

                  status: "draft",
                  value: "妖名：窃粮君。\n\n身份伪装：城中瘦小账房、夜市卖油郎、粮仓小吏。真身是一只背生灰纹的大鼠，尾巴像账绳，能把偷来的秘密打成结记住。\n\n出场章节：第五章，子时发现，某个子时完成收复、击败或交易。核心场景是粮仓、旧井、地下粮道、祠堂夹墙和黑市暗门。\n\n来源与动机：它原本是灾年粮仓里唯一活下来的老鼠，吃过贡米、尸骨和被官府扣下的救命粮。成精后不相信官府和大户，只相信粮食与情报。它不想统治人，只想让鼠群永远不再饿死。\n\n剧情矛盾：它一边替穷人偷粮，一边替黑市和妖道传信。它不是纯恶，但知道太多，也害怕被灭口。玩家要判断它是该杀、该抓、该交易，还是逼它交出幕后名单。\n\n能力机制：鼠群分摊伤害，本体不断钻洞换位；会偷玩家低级符箓和药，咬断灯绳让场景变暗，用鼠潮堵路。子时它能听见全城墙缝里的动静。\n\n破局方式：猫铃驱散鼠群，盐封洞限制换位，照妖符标记真身。若先解决粮荒或揭露贪官，它会主动谈判。\n\n后果：放过并立约，它成为地下情报商。杀死它可得鼠牙材料和账册，但粮仓鼠疫概率上升。骗它会导致后续物资被偷、传闻被篡改。"

                {
                  label: "牛精，中，第九章，丑时",

                  status: "draft",
                  value: "妖名：负轭公。\n\n身份伪装：沉默老农、驼背车夫、荒田守夜人。真身是黑角黄牛，背上长着半截破犁，牛铃声一响，田地会自己翻开。\n\n出场章节：第九章，丑时线。核心场景是荒田、土地庙、祭牛坑、乡绅庄院和被强征的粮道。\n\n来源与动机：它曾替村里耕田、拉车、送葬，灾年又被献给伪山神换雨。被献祭时，真正吞下贡品的是乡绅和伪神，牛只是替罪。成精后它不再相信人的眼泪，只认谁把轭套到谁脖子上。\n\n剧情矛盾：它惩罚的人大多有罪，但复仇开始扩大到无辜家眷和被迫执行命令的差役。玩家若只听富户说法，会以为它是凶妖；若听田地残魂，会知道整座村的粮债都压在它身上。\n\n能力机制：高韧性土妖。冲撞破坏掩体，踏地形成泥犁束缚，牛吼让玩家短暂失向。妖气牛轭不破，所有正面伤害降低。丑时它与土地相连，会从泥土中回血。\n\n破局方式：找到祭牛骨、断开伪山神香火、让乡绅公开粮账，可削弱怨轭。战斗中先打碎牛铃和犁刃，才能真正伤到本体。\n\n后果：度化后它成为守田灵，村中收成恢复，但罪人必须赔田还粮。强杀可得牛角、牛铃、土妖丹，却会让田地三季不熟。"

                  status: "draft",
                  value: "妖名：寅山君。\n\n身份伪装：城门口算命先生，摆旧虎皮垫，签筒里不是竹签而是削薄的虎骨签。真身为额纹带煞的老虎，身边常跟几道残缺伥影。\n\n出场章节：第四章，寅时线。核心场景是算命摊、太守府后门、城外山道和伥鬼旧林。\n\n来源与动机：它曾是山中猛虎，吞过害人的伥鬼，也吃过无辜路人。修成人形后想守山赎罪，却被兔妖抓住软肋。兔妖手里可能有它的虎骨签、幼虎后代，或它过去害人的伥鬼名册。\n\n剧情矛盾：它不是第四章主谋，却是兔妖最危险的爪牙。它知道太守府暗道、妖道联络点和兔妖的卯时弱点。玩家若逼得太紧，它会为保命杀人灭口；若给它脱身机会，它可能反咬兔妖。\n\n能力机制：人形阶段用命盘布阵，签筒落地后形成八方凶位；虎形阶段高爆发扑杀，虎吼造成摄魂硬直，山影分身从玩家背后扑出。寅时山煞最重，它第一次伏击几乎必定先手。\n\n破局方式：找到被兔妖控制的虎骨签，可解除咒缚；用镇魂符安抚伥鬼，可削弱虎吼；战斗中盯住额头王纹真身，能分辨山影。\n\n后果：合作后它提供太守府暗道，并在兔妖战中牵制护卫。杀死它可得虎骨、虎煞皮，但山林失去镇压，后续狼精、伥鬼活动增加。"

                  value: "妖名：月窟夫人。\n\n身份伪装：太守新宠小妾，白衣红绳，言语柔弱，擅长让别人替她作恶。真身是白兔妖，耳后有月牙形伤疤，影子在月光下会变成长耳妖形。\n\n出场章节：第四章，卯时线。核心场景是太守府、后宅花园、月门、胭脂铺和妖道布下的民怨法阵。\n\n来源与动机：她原是被猎户剥皮未死的白兔，藏入荒坟吸阴月之气成妖。她痛恨强者玩弄弱者，于是学会用美色和权势把掌权者变成傀儡。她与妖道合作，不是忠心，而是互相利用。\n\n剧情矛盾：太守确实被魅惑，但太守原本也贪色昏庸；兔妖确实作恶，但她最初的仇人也确实残忍。玩家不能只靠一句“妖怪害人”收束第四章，必须把官府腐败和妖道法阵一起处理。\n\n能力机制：高速幻身 Boss。她用红线牵住护卫替自己挡伤，用月影分身迷惑锁定，用魅惑凝视让玩家误伤 NPC。卯时她能借晨昏交界脱身。\n\n破局方式：先救出被控制的太守印信，截断妖道法阵，再逼她现形。镜子、鸡鸣、破魅符和断红线可破她防御。若提前公开妖身但没有证据，太守府会反通缉玩家。\n\n后果：杀她但不动妖道，第四章是假结案，妖道继续潜伏。公开官府罪证并斩断法阵，可让百姓声望大升。"

                  status: "draft",
                  value: "妖名：井阴娘娘。\n\n身份伪装：村外寡妇、采药女或梦中白衣人，身上有潮湿井水味。真身是盘踞古井与坟沟之间的大蛇，鳞片有血符烧痕，七寸处嵌着妖道留下的铜钉。\n\n出场章节：第一章，巳时线，大 Boss。核心场景是古井、蛇洞、牲畜棚、坟沟、荒庙和被蛇群包围的村路。\n\n来源与动机：她原本只是在井底修行的蛇精，被妖道喂血符、牲畜和阴魂后妖性大涨。妖道承诺助她蜕皮化蛟，她便替妖道制造恐慌，收集村民血气。她既是加害者，也是被妖道推进邪路的第一例证。\n\n剧情矛盾：第一章不能只做“打蛇”。玩家要从蛇灾中发现妖道痕迹：血符、异常祭品、被人故意打开的井封。若调查不足，杀蛇后只能得到表层胜利，看不到真正幕后。\n\n能力机制：毒、缠绕、潜伏和恐惧梦境。她能钻入水井换场，召蛇群封路，喷阴毒降低移动与视野。巳时她进入蜕皮阶段，旧皮分身替她承伤。\n\n破局方式：雄黄驱散小蛇，火符烧旧皮，照妖镜照出七寸铜钉。若先拔铜钉，她会短暂清醒并说出妖道线索。\n\n后果：封井镇压可保村庄短期平安，但蛇怨未解。彻底斩杀可得蛇胆、蛇鳞和毒牙材料，但后续妖道会更早察觉主角。"

                  label: "马精，善，第三章，大将军的宝马，午时",

                  status: "draft",
                  value: "妖名：赤鬃。\n\n身份伪装：偶尔化作披甲少年或沉默马夫。真身是汗血宝马，鬃毛如火，四蹄踏过会留下短暂火星。它不吃人血，只舔旧战场铁锈与军旗上的血气维持妖力。\n\n出场章节：第三章，午时线。核心场景是古战场、破军营、将军墓、断旗坡和阴兵操练地。\n\n来源与动机：它曾陪大将军冲阵，主人战死后仍守在战场。它能感到将军残魂，却分不清那是主人本心、战场怨气，还是邪修伪造的军令。它最大的愿望不是复仇，而是让主人真正卸甲。\n\n剧情矛盾：若玩家站在官府角度，会把它当成扰乱军冢的妖马；若听亡卒残魂，会知道它守了多年。第三章可借它表现善妖与忠义，让玩家第一次主动保护妖精。\n\n能力机制：通常不主动伤人。被逼战斗时以高速冲锋、踏火、回身踢和骑影突刺为主。午时阳气最盛，它最清醒，也能冲破阴兵阵。若邪修吹响假军号，它会短暂失控。\n\n破局方式：找到将军旧缰、半面军旗和最后军令，可让它认清邪修伪令。战斗中斩断阴兵缰绳比攻击赤鬃更有效。安魂术可让将军残魂亲口告别。\n\n后果：善待赤鬃，可解锁古战场通行、冲阵支援，甚至后期坐骑缘分。误杀它，将军残魂会怨变，第三章结局转暗。"

                  status: "draft",
                  value: "妖名：替罪翁。\n\n身份伪装：慈眉善目的庙祝、善堂老人或白胡子族老，永远劝人忍让。真身是白毛羊妖，双角缠满红布和罪签，背上挂着写满人名的小木牌。\n\n出场章节：第七章，未时线。核心场景是善堂、祭坛、羊皮鼓、赎罪井和挂满白布的村巷。\n\n来源与动机：它原本是祭祀里反复被献上的白羊，死后怨气附在羊骨和祭坛上。后来村镇用替罪仪式转移灾祸，它便借仪式成妖。它相信灾祸不能消失，只能转嫁。\n\n剧情矛盾：它确实让村子多年少灾，但代价是不断挑选弱者当替罪品。村民既是受害者也是帮凶，因为他们享受过仪式带来的平安。玩家要处理的不是一只羊妖，而是一套大家默认的残忍规矩。\n\n能力机制：替伤、诅咒、群体催眠。玩家攻击它时，伤害会转移到被挂名的村民或纸羊上。羊皮鼓响起时，场上 NPC 会跪拜挡路。未时它的替罪契约最稳。\n\n破局方式：找齐历代罪签，证明被献祭者并非自愿；毁羊皮鼓、断红布角、安抚祭品魂魄。战斗中要先救下被挂名者，否则越打因果污染越高。\n\n后果：破仪式后村子短期会遭遇真实灾厄，但长期摆脱献祭循环。若玩家接受“再献一人换平安”，会得到村民感谢和物资，但因果大幅变黑。"

                  status: "draft",
                  value: "妖名：申三。\n\n身份伪装：小乞丐、茶馆跑堂或戴斗笠的矮个旅人。真身是老猿开智，尾巴断过半截，喜欢把偷来的符箓、钥匙和人情账都挂在腰间。\n\n出场章节：第二章初登场，之后多章随机穿插。核心场景是山寺后林、屋顶追逐、集市戏台、破庙和客栈梁上。\n\n来源与动机：它常年偷听和尚、樵夫、道士说话，学会人言和几手小术。它想证明自己比人聪明，也想弄懂人为什么讲义气、守规矩、拜神又骗人。它的恶作剧往往是在试探主角。\n\n剧情矛盾：它不是传统反派，而是长期关系角色。玩家越守信，它越愿意帮忙；玩家越骗它，它越会在关键时刻捣乱。它能让妖物阵营显得有生活感，不只是敌人列表。\n\n能力机制：追逐战和机关战核心。它会爬墙、翻梁、投石、假摔、模仿 NPC 声音，还会偷玩家一个非关键快捷道具。申时它最活跃，能在屋顶和树梢之间连续换位。\n\n破局方式：给果子、酒、谜题、斗智小游戏，或陪它完成不伤人的恶作剧，可换取合作。若强行攻击，它会逃跑并留下假线索。\n\n后果：高好感下，它会偷来钥匙、拆穿假 NPC、救主角一次，甚至成为妖族支线牵线者。低好感下，它会偷走任务奖励、乱传主角坏话，或把玩家引进麻烦。"

                  value: "妖名：金冠娘子。\n\n身份伪装：卖鸡蛋的泼辣妇人、祠堂守夜女或嗓门很亮的茶摊老板。真身是金冠雉鸡精，尾羽带火色，叫声能刺破低级幻术。\n\n出场章节：第八章，酉时线，可与猪妖财主线绑定。核心场景是祠堂、晨钟楼、鸡市、财主粮仓外墙和阴气遮蔽的账房。\n\n来源与动机：她原是守祠堂的雉鸡，天天黎明啼叫驱邪，啄食香灰，听人诵经，救过被鬼压床的孩子。成精后她相信天亮就该真相大白，最恨夜里害人、白天装善。\n\n剧情矛盾：她是善妖，但嘴毒、急躁、看不起糊涂人。她能指出猪妖财主的破绽，却需要玩家保护她的祠堂和晨钟。若玩家此前滥杀家禽或拿鸡取乐，她会拒绝合作。\n\n能力机制：辅助型妖精。她的啼鸣可破幻、驱鬼、打断施法，让隐藏妖气短暂显形。战斗中她不耐打，需要玩家保护。酉时归巢时她能感知当天谁带着阴气进过村。\n\n破局方式：找回被偷的晨钟锤，保护祠堂香火，证明财主账房有阴契。猪妖战中若她存活，可用三次啼鸣打断猪妖吞食回血。\n\n后果：合作成功后，她成为第八章重要证人，并提供破邪羽、晨鸣符配方。若她死亡，猪妖线会变难，村民更难相信财主是妖。"

                  status: "draft",
                  value: "妖名：守门黑。\n\n身份伪装：极少化人，偶尔化作黑衣门房、驿站老卒或沉默护院。额心有一点白毛，能闻出谎言、尸气和妖气残留。\n\n出场章节：戌时线，可穿插在多个村镇，也可做隐藏支线。核心场景是旧宅门口、义犬坟、驿站、失踪案现场和夜巡村路。\n\n来源与动机：它原是义犬，主人死于冤案后仍守门不走。多年里它赶鬼、护孩童、追盗贼，被村民偷偷供饭，受感念成精。它不懂官场弯绕，只认气味、承诺和家门。\n\n剧情矛盾：它的忠义很纯，但也可能被旧誓言困住。若主人其实也有罪，玩家要让它接受真相。它适合做玩家道德检验：骗它一次，它很难再信任主角。\n\n能力机制：追踪与反隐辅助。它能嗅出妖怪真身路线，扑倒施法者，咬住隐形敌人的影子。对鬼魂和幻术抗性高。弱点是主人遗物、旧哨声和门槛誓言会让它短暂失神。\n\n破局方式：替它洗清主人冤屈，或证明主人真正死因；安葬旧主，修好旧门，完成“守到最后一夜”的承诺。战斗中保护它不被旧哨声控制，可保留追踪能力。\n\n后果：信任满后，它会在伏击中替玩家挡一次致命伤，或帮玩家识破变成人形的妖物。若玩家骗它，它会当众揭穿主角谎言。强杀它会让村镇善恶声望大幅下降。"

            {

              description: "醉卧沙场君莫笑，古来征战几人回。主题：英雄传说背后也有恐惧、逃亡与背叛，真相未必比怨魂更容易安葬。",
              fields: [
                {
                  label: "本章介绍：洛田县、赤焰马与将军死因",
                  guide: "涉及主城、沙漠边洛田县、沙漠（沙漠中有一部分是古战场）、甘德村（大河的北面出现僵尸的村子）、乌兰村（洛田县南边的村子）。",
                  status: "draft",
                  value: `
                    大将军沈孤鸿曾是朝廷最锋利的一把刀。他少年从军，百战不败，命格极硬。传闻他出生那夜，雷火劈开祖宅古槐，接生婆当场吓疯，口中只反复念着一句话：“此子不入轮回，死后亦不安宁。”

                    起初，士兵们敬他如神。

                    可连年出征之后，敬畏渐渐变成了恐惧。

                    每一次大战，沈孤鸿都能活着回来，可跟随他的士兵却十不存一。有人说他命硬克兵，有人说他身上带着煞气，凡是跟他上战场的人，都会被他的命数压死。更可怕的是，朝廷为了守边，屡屡下令强征，明知粮草不足、援军不到，却仍要他们死守荒原。

                    那一年，天气寒灾，军中断粮七日。

                    士兵们啃树皮，煮皮甲，最后连死去战马的骨头都被砸碎熬汤。沈孤鸿仍旧披甲巡营，命所有人守住最后一道防线。他知道一退，身后的城池便会被屠；可士兵们只知道，再不逃，他们全都会死在这里。

                    于是，恐惧生出了背叛。

                    几个校尉暗中串联，决定在最后一战里假死脱身。他们趁夜在尸堆里换上敌军残破衣甲，把战死同袍的脸划烂，冒充自己的尸首。可他们也清楚，沈孤鸿若活着回去，必定会查出真相。以沈孤鸿的军法，逃兵不只是斩首，连家中老幼都可能受牵连。

                    所以他们必须让沈孤鸿死。

                    他们在战场上从背后偷袭，将重伤的沈孤鸿拖入坑中。沈孤鸿临死前并未求饶，只盯着他们，声音嘶哑地问：

                    “边关未破，你们要往哪里逃？”

                    那一眼让所有人发寒。

                    有人想一刀了结，可其中一名曾跟随军中术士学过皮毛阵法的校尉拦住了他们。他说，沈孤鸿命格太硬，又死得冤，若只是杀了他，他必定化作厉鬼，循着血债一个个找回来。

                    于是他们用了更狠的办法。

                    他们割下沈孤鸿的头颅，将头颅带走，并布阵将其镇住，此阵法会使其魂魄无法离开此地，然后魂渐渐变弱，待到头骨腐朽成灰，魂便会散尽。魂魄认身，身首分离之后，若头颅不归，亡魂便会迷失。沈孤鸿的魂被困在旧战场，日复一日地重复死前最后一刻。他记得战鼓，记得雪，记得敌军冲杀，却始终想不起他是因何而死

                    逃兵们以为，只要等沈孤鸿的头盖骨腐朽成灰，他的魂魄便会彻底散尽。那时阵法自然消失，他们也就再无后患。

                    可他们没有想到，沈孤鸿的战马还活着。

                    那匹马名叫赤焰马，是沈孤鸿从死人堆里救下来的。它通体鲜红，四蹄乌黑，跟随沈孤鸿十余年，能在乱军中认出主人的号角，也能在血泊里找到主人的气息。

                    大战之后，它守在旧战场不肯离去。

                    起初，它只是用蹄子刨开冻土，想把沈孤鸿的尸身刨出来。后来，它开始在夜里离开战场，去附近村庙偷供桌上的贡品、香火灰、祭酒和纸钱。

                    香火能稳魂，祭酒能聚念，贡品能续阴气。

                  value: "多结局，冰释前嫌或拒绝，沈孤鸿继续守卫沙场，投胎。等等。             最终处理沈孤鸿残魂、赤焰马、乌兰村真相，并同时结算洛田县和甘德村后果。\n\n主要分支：\n1. 完整公开真相：洛田县重修阵亡名册，军户祠堂重新立碑，乌兰村长老受审，后代可由玩家求情。沈孤鸿怨气最重，但若玩家同时证明士兵恐惧并非全是贪生，并收敛甘德村被丢弃的旧军尸骨，就能完成高难度度化。\n2. 隐去部分真相：主角只让沈孤鸿知道头颅与背叛，不把乌兰村后代全部交出。赤焰马会认可主角的慈悲；洛田县史书仍不完整；甘德村尸患会减轻但留有尾巴。\n3. 镇压或炼化：最快结束古战场异象，获得强力材料，但赤焰马敌对或消失。洛田县会把真相压成“妖马作祟已除”，甘德村大僵尸战臣则吸收剩余尸气，后续更危险。\n4. 交易真相：把头骨、阵法或军籍秘密卖给官府、盗墓商人或乌兰村长老，得到资源，承负大幅下降。洛田县和甘德村都会留下未清的怨气。\n\n大僵尸战臣结算：如果玩家在甘德村选择收敛遗骸、安抚尸气，大僵尸战臣暂时被压回暗处，第七章还有说服、斋醮科仪或善念放走的空间；如果玩家粗暴焚尸、吞噬尸魂或破坏尸骨，大僵尸战臣会吸收乱坟滩怨气，成为第七章更强的僵尸祸源。\n\n小僵尸变量：第一章被放走的小僵尸会在第三章暗中保护主角，并在大僵尸战臣线里留下“想救人但力量不足”的伏笔；若第一章小僵尸被主角杀过，它会以虚弱状态跟随，并更容易被大僵尸战臣吞噬。这个结果会延伸到第七章和第九章。\n\n收束后，主角返回天衡府，第三章名声开始扩散。洛田县会根据玩家选择出现不同传闻，甘德村则决定是否恢复渡口。申三可在城墙上短暂出现，偷走一枚旧军扣又还给主角。夜市老人提到天衡府夜里有鬼市，里面有人贩卖虎骨签、月宫脂粉和能改命的凭证，第四章由此进入。",

                  value: "大僵尸战臣出现。沈孤鸿帮忙解决战臣。主角取得沈孤鸿头颅或头骨所在位置后，必须决定如何带回古战场。乌兰村长老可能阻拦，认为头骨一归，沈孤鸿必会循血债复仇；洛田县官府则想把头骨扣下，当成平息军户争议的证物；甘德村方向的大僵尸战臣也终于被头骨煞气引出，开始从废渡口驱尸南下。\n\n第八节才是真正面对大僵尸战臣的节点。战臣不是普通尸王，它生前是敌军将军，曾多次与沈孤鸿在边境交战。最后一战中，战臣率残军突围，被沈孤鸿斩杀。它死后尸骨没有被本族收回，也没有被洛田县军方妥善收敛，反而被风沙、乱坟滩尸气、困魂阵外泄的阴气一点点拖成僵尸。\n\n因此战臣追的不是主角，而是沈孤鸿。它要找沈孤鸿复仇：既恨沈孤鸿杀了自己，也恨沈孤鸿死后仍被香火和赤焰马护住，而自己作为败军之将只能在乱坟滩和废渡口之间腐烂。头颅归阵前，沈孤鸿残魂记忆不全，战臣找不到真正的仇人；头颅一出现，战臣才真正现身。\n\n护送路线可分为三条：\n1. 走洛田县外城：可借官道快行，但官府和军户会强行介入，要求公开审理。\n2. 走甘德村废渡口：可避开官府，但会触发战臣尸潮和小僵尸变量。\n3. 走乌兰村南道：最快到古战场，但乌兰村守秘者会追击，赤焰马也最容易加入护送。\n\n甘德村路线专门回收第一章小僵尸选择：\n1. 第一章放走小僵尸：它会跳出来挡在主角前面，试图拖住战臣。若玩家继续硬战，小僵尸可能被战臣吞噬；若玩家改用斋醮科仪或说服，可保住小僵尸并削弱战臣。\n2. 第一章“杀死”小僵尸：小僵尸以虚弱状态出现，更容易被战臣控制。玩家若提前发现它还活着，可选择救它；否则它会被吞入战臣体内，成为第七章反噬伏笔。\n3. 若玩家在甘德村善待尸群，战臣开场不会立刻死战，而是先寻找沈孤鸿；若玩家此前粗暴焚尸，战臣会把主角也视作毁尸仇敌，在护送中正面爆发。\n\n玩家可以正面击败战臣，也可以用斋醮科仪、敌军残甲、战场遗物和沈孤鸿恢复的记忆，让战臣暂时停手。处理完战臣后，头颅归身，沈孤鸿恢复记忆。恢复记忆不是直接安魂，而是让他同时记起忠义、饥寒、士兵恐惧、敌军战臣、甘德村尸骨和背后那一刀。",

                  status: "draft",
                  value: `

                  镇上的一个妇人刘碧珠，嫉妒苏秀莲的美貌，想让她身败名裂。就到处造谣说贪图赵英剑的金钱，和赵英剑苟合在了一起。加之之前赵英剑在苏秀莲家想要侵犯苏秀莲的事情也传得沸沸扬扬的，镇上的人也就误信了谣言。

                  半年后，赵石林伤好后，又回到了采石场。同镇的人也把消息带给了苏秀莲。赵英剑得知赵石林没有死，担心赵石林回来得知真相后，一直担心赵石林报复自己，不知如何是好。

                  小孩其实也没有沉入河中，赵石林本想这样做，但是感觉这样太残忍，下不去手，变把放在道观门口。他叩响的道观的门，听到有动静后，便躲在了远处看着，直到看到有道士把小孩子带回去，才放心地离开了。

                  赵英剑当时很年轻，才犯下了错。但是赵英剑痛改前非，后来居然考取功名，成了大官。苏秀莲修炼成型后，赵英剑已经是大官了。

    const state = {
      searchText: "",
      todoOnly: false,
      observer: null,
      activeSections: {},
      relationView: "overview",
      navigationLockUntil: 0
    };

    const elements = {
      projectName: document.getElementById("projectName"),
      projectSubtitle: document.getElementById("projectSubtitle"),
      mobileProjectName: document.getElementById("mobileProjectName"),
      mobileProjectSubtitle: document.getElementById("mobileProjectSubtitle"),
      heroTitle: document.getElementById("heroTitle"),
      heroDesc: document.getElementById("heroDesc"),
      metaGrid: document.getElementById("metaGrid"),
      footerText: document.getElementById("footerText"),
      desktopToc: document.getElementById("desktopToc"),
      mobileToc: document.getElementById("mobileToc"),
      mobileHeader: document.querySelector(".mobile-header"),
      mobileMenuToggle: document.getElementById("mobileMenuToggle"),
      toolbarWrap: document.querySelector(".toolbar-wrap"),
      documentInner: document.getElementById("documentInner"),
      searchInput: document.getElementById("searchInput"),
      todoOnlyBtn: document.getElementById("todoOnlyBtn"),
      progressText: document.getElementById("progressText"),
      progressBar: document.getElementById("progressBar"),
      relationTabs: document.getElementById("relationTabs"),
      relationView: document.getElementById("relationView")

    document.addEventListener("DOMContentLoaded", initializeApp);

    function initializeApp() {
      validateDocumentData();

      renderProject();
      renderToc();
      renderDocument();
      renderProgress();
      renderRelationTabs();
      renderRelationView();
      bindEvents();
      setupStickyMeasurements();
      observeActiveChapter();
      syncActiveChapterFromHash();
    }

    function bindEvents() {
      elements.mobileMenuToggle.addEventListener("click", () => {
        const shouldOpen = !elements.mobileHeader.classList.contains("menu-open");
        setMobileMenuOpen(shouldOpen);
      });

      elements.searchInput.addEventListener("input", (event) => {
        state.searchText = event.target.value.trim().toLowerCase();
        renderDocument();
        observeActiveChapter();
        syncActiveChapterFromViewport();
      });

      elements.todoOnlyBtn.addEventListener("click", () => {
        state.todoOnly = !state.todoOnly;
        elements.todoOnlyBtn.classList.toggle("active", state.todoOnly);
        renderDocument();
        observeActiveChapter();
        syncActiveChapterFromViewport();
      });

      elements.documentInner.addEventListener("click", (event) => {
        const dialogueChoice = event.target.closest("[data-dialogue-choice]");

        if (dialogueChoice) {
          activateDialogueChoice(dialogueChoice);
          return;
        }

        const dialogueRestart = event.target.closest("[data-dialogue-restart]");

        if (dialogueRestart) {
          restartDialogue(dialogueRestart.closest("[data-dialogue-tree]"));
          return;
        }

        const button = event.target.closest("[data-section-tab]");

        if (!button) {
          return;
        }

        state.activeSections[button.dataset.chapterId] = Number(button.dataset.sectionIndex);
        renderDocument();
        observeActiveChapter();
      });

      [elements.desktopToc, elements.mobileToc].forEach((toc) => {
        toc.addEventListener("click", (event) => {
          const link = event.target.closest("[data-chapter-link]");

          if (!link) {
            return;
          }

          state.navigationLockUntil = Date.now() + 800;
          setMobileMenuOpen(false);
          setActiveChapter(link.dataset.chapterLink);
          window.setTimeout(syncActiveChapterFromHash, 850);
        });
      });

      document.addEventListener("click", (event) => {
        if (!elements.mobileHeader.contains(event.target)) {
          setMobileMenuOpen(false);
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          setMobileMenuOpen(false);
          elements.mobileMenuToggle.focus();
        }
      });

      elements.relationTabs.addEventListener("click", (event) => {
        const button = event.target.closest("[data-relation-view]");

        if (!button) {
          return;
        }

        state.relationView = button.dataset.relationView;
        renderRelationTabs();
        renderRelationView();
      });

      window.addEventListener("hashchange", syncActiveChapterFromHash);
    }

    function setMobileMenuOpen(isOpen) {
      elements.mobileHeader.classList.toggle("menu-open", isOpen);
      elements.mobileMenuToggle.setAttribute("aria-expanded", String(isOpen));
    }

    function setupStickyMeasurements() {
      const updateStickyMeasurements = () => {
        const mobileHeaderHeight = window.innerWidth <= 900 && elements.mobileHeader
          ? elements.mobileHeader.getBoundingClientRect().height
          : 0;
        const toolbarWrapHeight = elements.toolbarWrap
          ? elements.toolbarWrap.getBoundingClientRect().height
          : 0;

        document.documentElement.style.setProperty("--mobile-header-height", `${Math.ceil(mobileHeaderHeight)}px`);
        document.documentElement.style.setProperty("--toolbar-wrap-height", `${Math.ceil(toolbarWrapHeight)}px`);
      };

      updateStickyMeasurements();
      window.addEventListener("resize", updateStickyMeasurements);

      if ("ResizeObserver" in window) {
        const resizeObserver = new ResizeObserver(updateStickyMeasurements);
        resizeObserver.observe(elements.mobileHeader);
        resizeObserver.observe(elements.toolbarWrap);
      }
    }

    function validateDocumentData() {
      const warnings = [];
      const chapterIds = new Map();
      const chapterIndexes = new Map();

      GAME_DOCUMENT.chapters.forEach((chapter) => {
        const chapterName = `${chapter.index} · ${chapter.title}`;

        if (!/^[a-z0-9-]+$/.test(chapter.id)) {
          warnings.push(`章节 id 不规范：${chapterName}，当前 id 是 "${chapter.id}"。建议只用小写英文、数字和短横线。`);
        }

        if (chapterIds.has(chapter.id)) {
          warnings.push(`章节 id 重复：${chapter.id}，出现在 "${chapterIds.get(chapter.id)}" 和 "${chapterName}"。`);
        } else {
          chapterIds.set(chapter.id, chapterName);
        }

        if (chapterIndexes.has(chapter.index)) {
          warnings.push(`章节编号重复：Chapter ${chapter.index}，出现在 "${chapterIndexes.get(chapter.index)}" 和 "${chapterName}"。`);
        } else {
          chapterIndexes.set(chapter.index, chapterName);
        }

        chapter.sections.forEach((section, sectionPosition) => {
          if (!section.title || !section.title.trim()) {
            warnings.push(`空 section 标题：${chapterName} 的第 ${sectionPosition + 1} 个 section。`);
          }

          section.fields.forEach((field, fieldPosition) => {
            const fieldPath = `${chapterName} > ${section.title || "未命名 section"} > 第 ${fieldPosition + 1} 个字段`;
            const segmentText = getTaskSegmentText(getTaskSegments(field));
            const dialogueText = getDialogueText(getDialogueLines(field));
            const hasFieldContent = String(field.value || "").trim() !== ""
              || segmentText !== ""
              || dialogueText !== "";

            if (!field.label || !field.label.trim()) {
              warnings.push(`字段 label 为空：${fieldPath}。`);
            }

            if (field.status === "todo" && hasFieldContent) {
              warnings.push(`字段已有内容但 status 仍是 todo：${fieldPath}。建议改成 draft。`);
            }

            if (field.status === "draft" && !hasFieldContent) {
              warnings.push(`字段是 draft 但 value 为空：${fieldPath}。建议改成 todo。`);
            }

            getTaskSegments(field).forEach((segment, segmentIndex) => {
              if (!segment.title) {
                warnings.push(`任务段标题为空：${fieldPath} > 第 ${segmentIndex + 1} 段。`);
              }

              segment.dialogue.forEach((node) => {
                node.choices.forEach((choice) => {
                  if (choice.next && choice.next === node.id) {
                    warnings.push(`对话选项循环指向自身：${fieldPath} > ${node.id} > ${choice.id}。`);
                  }
                });
              });
            });
          });
        });
      });

      if (warnings.length > 0) {
        console.group("道行天涯文档数据检查");
        warnings.forEach((warning) => console.warn(warning));
        console.groupEnd();
      }
    }

    function renderProject() {
      const project = GAME_DOCUMENT.project;

      document.title = project.title;

      elements.projectName.textContent = project.name;
      elements.projectSubtitle.textContent = project.subtitle;
      elements.mobileProjectName.textContent = project.name;
      elements.mobileProjectSubtitle.textContent = project.subtitle;
      elements.heroTitle.textContent = project.title;
      elements.heroDesc.textContent = project.description;
      elements.footerText.textContent = `${project.name} · Last Updated ${project.lastUpdated}`;

      elements.metaGrid.innerHTML = project.meta
        .map((item) => `<span class="meta-pill">${escapeHtml(item)}</span>`)
        .join("");
    }

    function getTocItems() {
      return [
        ...GAME_DOCUMENT.chapters.map((chapter) => ({
          id: chapter.id,
          index: chapter.index,
          title: chapter.title
        })),
        {
          id: "relation-map",
          index: "19",
          title: "关系图谱与影响矩阵"
        }
      ];
    }

    function renderToc() {
      const tocItems = getTocItems();

      const desktopHtml = tocItems
        .map((item) => {
          return `
            <a href="#chapter-${escapeHtml(item.id)}" data-chapter-link="${escapeHtml(item.id)}">
              ${escapeHtml(item.index)} · ${escapeHtml(item.title)}
            </a>
          `;
        })
        .join("");

      const mobileHtml = tocItems
        .map((item) => {
          return `
            <a href="#chapter-${escapeHtml(item.id)}" data-chapter-link="${escapeHtml(item.id)}">
              ${escapeHtml(item.index)} · ${escapeHtml(item.title)}
            </a>
          `;
        })
        .join("");

      elements.desktopToc.innerHTML = desktopHtml;
      elements.mobileToc.innerHTML = mobileHtml;
    }

    function renderDocument() {
      const html = GAME_DOCUMENT.chapters
        .map((chapter) => renderChapter(chapter))
        .filter(Boolean)
        .join("");

      elements.documentInner.innerHTML = html || `
        <div class="empty-state">
          没有找到匹配内容。可以换一个关键词，或关闭“只看待补充”。
        </div>
      `;
    }

    function renderChapter(chapter) {
      const chapterMatchesSearch = matchesSearch([
        chapter.index,
        chapter.title,
        chapter.description
      ]);

      const renderedSections = chapter.sections
        .map((section, sectionIndex) => {
          return {
            section,
            sectionIndex,
            html: renderSection(section, chapterMatchesSearch, chapter)
          };
        })
        .filter((item) => item.html);

      if (renderedSections.length === 0) {
        return "";
      }

      const isFiltering = Boolean(state.searchText || state.todoOnly);
      const activeSectionIndex = getActiveSectionIndex(chapter, renderedSections);
      const visibleSections = isFiltering
        ? renderedSections
        : renderedSections.filter((item) => item.sectionIndex === activeSectionIndex);

      return `
        <article class="chapter" id="chapter-${escapeHtml(chapter.id)}" data-chapter="${escapeHtml(chapter.id)}">
          <div class="chapter-head">
            <div class="chapter-index">Chapter ${escapeHtml(chapter.index)}</div>
            <h2>${escapeHtml(chapter.title)}</h2>
            <p class="chapter-description">${escapeHtml(chapter.description)}</p>
          </div>

          ${renderSectionTabs(chapter, renderedSections, activeSectionIndex, isFiltering)}

          <div class="section-list">
            ${visibleSections.map((item) => item.html).join("")}
          </div>
        </article>
      `;
    }

    function getActiveSectionIndex(chapter, renderedSections) {
      const savedIndex = state.activeSections[chapter.id];
      const hasSavedIndex = renderedSections.some((item) => item.sectionIndex === savedIndex);

      if (hasSavedIndex) {
        return savedIndex;
      }

      return renderedSections[0].sectionIndex;
    }

    function renderSectionTabs(chapter, renderedSections, activeSectionIndex, isFiltering) {
      if (renderedSections.length <= 1) {
        return "";
      }

      return `
        <div class="section-tabs" aria-label="${escapeHtml(chapter.title)}分组切换">
          ${renderedSections.map((item) => {
            const isActive = item.sectionIndex === activeSectionIndex && !isFiltering;
            const activeClass = isActive ? "active" : "";
            const filteringClass = isFiltering ? "is-filtering" : "";
            const label = item.section.title && item.section.title.trim()
              ? item.section.title
              : `未命名分组 ${item.sectionIndex + 1}`;

            return `
              <button
                class="section-tab ${activeClass} ${filteringClass}"
                type="button"
                data-section-tab
                data-chapter-id="${escapeHtml(chapter.id)}"
                data-section-index="${escapeHtml(String(item.sectionIndex))}"
              >
                ${escapeHtml(label)}
              </button>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderSection(section, inheritedSearchMatch, chapter) {
      const sectionMatchesSearch = inheritedSearchMatch || matchesSearch([
        section.title,
        section.description
      ]);

      const renderedFields = section.fields
        .map((field) => renderField(field, sectionMatchesSearch, { chapter, section }))
        .filter(Boolean);

      if (renderedFields.length === 0) {
        return "";
      }

      return `
        <section class="doc-section">
          <div class="section-head">
            <h3>${escapeHtml(section.title)}</h3>
            <p>${escapeHtml(section.description)}</p>
          </div>

          <div class="field-list">
            ${renderedFields.join("")}
          </div>
        </section>
      `;
    }

    function renderField(field, inheritedSearchMatch, context = {}) {
      const normalizedValue = String(field.value || "").trim();
      const dialogueLines = getDialogueLines(field);
      const dialogueText = getDialogueText(dialogueLines);
      const taskSegments = getTaskSegments(field);
      const taskSegmentText = getTaskSegmentText(taskSegments);
      const rewardEntries = getRewardEntries(field, context);
      const rewardText = getRewardText(rewardEntries);
      const hasRewardContent = rewardEntries.some((entry) => entry.value !== "");
      const hasDialogue = dialogueLines.length > 0;
      const hasTaskSegments = taskSegments.length > 0;
      const fieldBody = normalizedValue || taskSegmentText || dialogueText || (hasRewardContent ? rewardText : "");
      const isTodo = field.status === "todo" || fieldBody === "";

      if (state.todoOnly && !isTodo) {
        return "";
      }

      const fieldMatchesSearch = inheritedSearchMatch || matchesSearch([
        field.label,
        field.guide,
        field.status,
        field.value,
        taskSegmentText,
        dialogueText,
        rewardText
      ]);

      if (state.searchText && !fieldMatchesSearch) {
        return "";
      }

      const statusLabel = getStatusLabel(field.status, fieldBody);
      const content = normalizedValue || "待补充。";

      return `
        <div class="field-row ${isTodo ? "todo" : ""}">
          <div class="field-top">
            <div class="field-label">${escapeHtml(field.label)}</div>
            <span class="status ${escapeHtml(statusLabel.className)}">${escapeHtml(statusLabel.text)}</span>
          </div>

          <div class="field-guide">${escapeHtml(field.guide)}</div>
          ${normalizedValue ? `<div class="field-content">${escapeHtml(content)}</div>` : ""}
          ${hasTaskSegments ? renderTaskSegments(taskSegments) : ""}
          ${hasDialogue && !hasTaskSegments ? renderDialogue(dialogueLines) : ""}
          ${rewardEntries.length > 0 ? renderRewards(rewardEntries) : ""}
          ${!normalizedValue && !hasDialogue && !hasTaskSegments && isTaskContext(context)
            ? renderEmptyTaskStructure()
            : ""}
          ${!normalizedValue && !hasDialogue && !hasTaskSegments && !isTaskContext(context)
            ? `<div class="field-content">${escapeHtml(content)}</div>`
            : ""}
        </div>
      `;
    }

    function getTaskSegments(field) {
      const rawSegments = Array.isArray(field.segments)
        ? field.segments
        : Array.isArray(field.tasks)
          ? field.tasks
          : Array.isArray(field.steps)
            ? field.steps
            : [];

      return rawSegments.map((segment, index) => {
        if (typeof segment === "string") {
          return {
            id: `segment-${index + 1}`,
            title: `任务段 ${index + 1}`,
            location: "",
            objective: "",
            trigger: "",
            content: segment,
            completion: "",
            dialogue: []
          };
        }

        return {
          id: String(segment.id || `segment-${index + 1}`).trim(),
          title: String(segment.title || segment.name || `任务段 ${index + 1}`).trim(),
          location: String(segment.location || segment.place || "").trim(),
          objective: String(segment.objective || segment.goal || "").trim(),
          trigger: String(segment.trigger || segment.requirement || "").trim(),
          content: String(segment.content || segment.value || segment.description || "").trim(),
          completion: String(segment.completion || segment.outcome || segment.result || "").trim(),
          dialogue: getDialogueLines(segment.dialogue || segment.conversation || segment.lines || [])
        };
      });
    }

    function getTaskSegmentText(segments) {
      return segments.map((segment) => [
        segment.id,
        segment.title,
        segment.location,
        segment.objective,
        segment.trigger,
        segment.content,
        segment.completion,
        getDialogueText(segment.dialogue)
      ].join(" ")).join(" ").trim();
    }

    function renderTaskSegments(segments) {
      return `
        <div class="task-segment-list">
          ${segments.map((segment, index) => {
            const meta = [
              ["地点", segment.location],
              ["当前目标", segment.objective],
              ["触发条件", segment.trigger]
            ].filter((item) => item[1]);

            return `
              <article class="task-segment">
                <div class="task-segment-head">
                  <div>
                    <div class="task-segment-index">Segment ${index + 1}</div>
                    <div class="task-segment-title">${escapeHtml(segment.title)}</div>
                  </div>
                  <div class="task-segment-id">${escapeHtml(segment.id)}</div>
                </div>
                <div class="task-segment-body">
                  ${meta.length ? `
                    <div class="task-meta-grid">
                      ${meta.map(([label, value]) => `
                        <div class="task-meta-item">
                          <div class="task-meta-label">${escapeHtml(label)}</div>
                          <div class="task-meta-value">${escapeHtml(value)}</div>
                        </div>
                      `).join("")}
                    </div>
                  ` : ""}
                  ${segment.content ? `<div class="task-segment-content">${escapeHtml(segment.content)}</div>` : ""}
                  ${segment.dialogue.length ? renderDialogue(segment.dialogue) : ""}
                  ${segment.completion ? `
                    <div class="task-meta-item" style="margin-top: 12px;">
                      <div class="task-meta-label">完成与流转</div>
                      <div class="task-meta-value">${escapeHtml(segment.completion)}</div>
                    </div>
                  ` : ""}
                </div>
              </article>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderEmptyTaskStructure() {
      return `
        <div class="task-structure-empty">
          待补充任务结构：可在本节加入 <code>segments</code>，拆分为多个任务段；每段可填写地点、目标、触发条件、剧情、对话节点与完成结果。对话节点中的 <code>choices</code> 可配置多条主角回复、检定条件、奖励、旗标变化和后续节点。
        </div>
      `;
    }

    function getRewardEntries(field, context) {
      const hasCustomRewards = field.rewards && typeof field.rewards === "object";
      const shouldShowTaskRewards = isTaskContext(context);

      if (!hasCustomRewards && !shouldShowTaskRewards) {
        return [];
      }

      const rewards = hasCustomRewards ? field.rewards : {};
      const entries = [
        ["experience", "经验奖励"],
        ["items", "物品奖励"],
        ["reputation", "声望 / 承负"],
        ["followup", "后续影响"]
      ];

      return entries.map(([key, label]) => {
        const value = Array.isArray(rewards[key])
          ? rewards[key].join("\n")
          : String(rewards[key] || "").trim();

        return { key, label, value };
      });
    }

    function isTaskContext(context) {
      const chapterId = context.chapter ? context.chapter.id : "";
      const sectionTitle = context.section ? String(context.section.title || "") : "";

      return (chapterId === "main-story" || chapterId === "side-story")
        && /主线|支线/.test(sectionTitle);
    }

    function getRewardText(entries) {
      return entries
        .map((entry) => `${entry.label} ${entry.value}`.trim())
        .join(" ")
        .trim();
    }

    function renderRewards(entries) {
      return `
        <div class="reward-grid">
          ${entries.map((entry) => {
            const value = entry.value || "待补充。";
            const emptyClass = entry.value ? "" : " empty";

            return `
              <div class="reward-item">
                <div class="reward-label">${escapeHtml(entry.label)}</div>
                <div class="reward-value${emptyClass}">${escapeHtml(value)}</div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function getDialogueLines(source) {
      const rawLines = Array.isArray(source)
        ? source
        : Array.isArray(source.dialogue)
          ? source.dialogue
          : Array.isArray(source.conversation)
            ? source.conversation
            : Array.isArray(source.lines)
              ? source.lines
              : [];

      return rawLines
        .map((line, index) => {
          if (typeof line === "string") {
            return {
              id: `dialogue-${index + 1}`,
              side: "narration",
              speaker: "",
              text: line,
              choices: []
            };
          }

          return {
            id: String(line.id || line.nodeId || `dialogue-${index + 1}`).trim(),
            side: normalizeDialogueSide(line.side || line.type || line.role || line.speaker),
            speaker: String(line.speaker || "").trim(),
            text: String(line.text || line.value || "").trim(),
            choices: getDialogueChoices(line)
          };
        })
        .filter((line) => line.text !== "" || line.choices.length > 0);
    }

    function getDialogueChoices(line) {
      const rawChoices = Array.isArray(line.choices)
        ? line.choices
        : Array.isArray(line.replies)
          ? line.replies
          : Array.isArray(line.responses)
            ? line.responses
            : [];

      return rawChoices.map((choice, index) => {
        if (typeof choice === "string") {
          return {
            id: `choice-${index + 1}`,
            text: choice,
            requirement: "",
            check: "",
            result: "",
            reward: "",
            flags: "",
            next: ""
          };
        }

        const rewards = choice.rewards && typeof choice.rewards === "object"
          ? Object.entries(choice.rewards)
              .map(([key, value]) => `${key}: ${Array.isArray(value) ? value.join("、") : value}`)
              .join("；")
          : String(choice.reward || choice.gain || choice.rewards || "").trim();

        const flags = Array.isArray(choice.flags)
          ? choice.flags.join("、")
          : String(choice.flags || choice.flag || "").trim();

        return {
          id: String(choice.id || `choice-${index + 1}`).trim(),
          text: String(choice.text || choice.label || choice.reply || "").trim(),
          requirement: String(choice.requirement || choice.condition || choice.requires || "").trim(),
          check: String(choice.check || choice.skillCheck || "").trim(),
          result: String(choice.result || choice.outcome || choice.effect || "").trim(),
          reward: rewards,
          flags,
          next: String(choice.next || choice.nextId || choice.goto || "").trim()
        };
      }).filter((choice) => choice.text !== "");
    }

    function normalizeDialogueSide(value) {
      const side = String(value || "").trim().toLowerCase();

      if (["主角", "protagonist", "hero", "player", "left"].includes(side)) {
        return "protagonist";
      }

      if (["对方", "npc", "enemy", "opponent", "right"].includes(side)) {
        return "npc";
      }

      return "narration";
    }

    function getDialogueText(lines) {
      return lines
        .map((line) => {
          const choices = line.choices.map((choice) => [
            choice.text,
            choice.requirement,
            choice.check,
            choice.result,
            choice.reward,
            choice.flags,
            choice.next
          ].join(" ")).join(" ");

          return `${line.speaker} ${line.text} ${choices}`.trim();
        })
        .join(" ")
        .trim();
    }

    function renderDialogue(lines) {
      const nodeIds = new Set(lines.map((line) => line.id));
      const hasInternalBranches = lines.some((line) => {
        return line.choices.some((choice) => choice.next && nodeIds.has(choice.next));
      });

      return `
        <div class="dialogue-list" ${hasInternalBranches ? "data-dialogue-tree" : ""}>
          ${hasInternalBranches ? `<div class="dialogue-history" data-dialogue-history></div>` : ""}
          ${lines.map((line, lineIndex) => {
            const speaker = line.speaker
              ? `<div class="dialogue-speaker">${escapeHtml(line.speaker)}</div>`
              : "";
            const hidden = hasInternalBranches && lineIndex > 0 ? " hidden" : "";

            return `
              <div class="dialogue-node" data-dialogue-node-id="${escapeHtml(line.id)}"${hidden}>
                <div class="dialogue-node-id">${escapeHtml(line.id)}</div>
                <div class="dialogue-line ${escapeHtml(line.side)}">
                  <div class="dialogue-bubble">
                    ${speaker}
                    <div class="dialogue-text">${escapeHtml(line.text)}</div>
                  </div>
                </div>
                ${line.choices.length ? `
                  <div class="dialogue-choices" aria-label="主角回复选项">
                    ${line.choices.map((choice, index) => renderDialogueChoice(choice, index)).join("")}
                  </div>
                ` : ""}
              </div>
            `;
          }).join("")}
          ${hasInternalBranches ? `
            <div class="dialogue-branch-result" data-dialogue-result></div>
            <button class="dialogue-restart" type="button" data-dialogue-restart>重新选择</button>
          ` : ""}
        </div>
      `;
    }

    function renderDialogueChoice(choice, index) {
      const tags = [
        choice.requirement ? ["requirement", "条件", choice.requirement] : null,
        choice.check ? ["requirement", "检定", choice.check] : null,
        choice.result ? ["result", "结果", choice.result] : null,
        choice.reward ? ["reward", "获得 / 失去", choice.reward] : null,
        choice.flags ? ["result", "旗标", choice.flags] : null,
        choice.next ? ["next", "后续", choice.next] : null
      ].filter(Boolean);

      return `
        <button
          class="dialogue-choice"
          type="button"
          data-dialogue-choice
          data-choice-id="${escapeHtml(choice.id)}"
          data-choice-text="${escapeHtml(choice.text)}"
          data-choice-result="${escapeHtml(choice.result)}"
          data-choice-reward="${escapeHtml(choice.reward)}"
          data-choice-flags="${escapeHtml(choice.flags)}"
          data-choice-next="${escapeHtml(choice.next)}"
        >
          <div class="dialogue-choice-text">${index + 1}. ${escapeHtml(choice.text)}</div>
          ${tags.length ? `
            <div class="choice-tags">
              ${tags.map(([className, label, value]) => `
                <span class="choice-tag ${className}">${escapeHtml(label)}：${escapeHtml(value)}</span>
              `).join("")}
            </div>
          ` : ""}
        </button>
      `;
    }

    function activateDialogueChoice(button) {
      const tree = button.closest("[data-dialogue-tree]");

      if (!tree) {
        return;
      }

      const currentNode = button.closest("[data-dialogue-node-id]");
      const nextId = button.dataset.choiceNext || "";
      const history = tree.querySelector("[data-dialogue-history]");
      const resultBox = tree.querySelector("[data-dialogue-result]");
      const restartButton = tree.querySelector("[data-dialogue-restart]");
      const resultParts = [
        button.dataset.choiceResult ? `结果：${button.dataset.choiceResult}` : "",
        button.dataset.choiceReward ? `获得 / 失去：${button.dataset.choiceReward}` : "",
        button.dataset.choiceFlags ? `旗标：${button.dataset.choiceFlags}` : ""
      ].filter(Boolean);

      if (history) {
        if (currentNode) {
          const currentLine = currentNode.querySelector(".dialogue-line");
          const currentSpeaker = currentNode.querySelector(".dialogue-speaker")?.textContent.trim() || "旁白";
          const currentText = currentNode.querySelector(".dialogue-text")?.textContent.trim() || "";
          const currentSide = currentLine?.classList.contains("npc")
            ? "npc"
            : currentLine?.classList.contains("protagonist")
              ? "protagonist"
              : "narration";

          if (currentText) {
            const npcHistoryItem = document.createElement("div");
            npcHistoryItem.className = `dialogue-history-item ${currentSide}`;
            npcHistoryItem.textContent = `${currentSpeaker}：${currentText}`;
            history.appendChild(npcHistoryItem);
          }
        }

        const protagonistHistoryItem = document.createElement("div");
        protagonistHistoryItem.className = "dialogue-history-item protagonist";
        protagonistHistoryItem.textContent = `主角：${button.dataset.choiceText || "已选择回复"}`;
        history.appendChild(protagonistHistoryItem);
      }

      if (currentNode) {
        currentNode.hidden = true;
      }

      const targetNode = nextId
        ? [...tree.querySelectorAll("[data-dialogue-node-id]")]
            .find((node) => node.dataset.dialogueNodeId === nextId)
        : null;

      if (targetNode) {
        targetNode.hidden = false;
        resultBox.textContent = resultParts.length
          ? resultParts.join("\n")
          : "已进入后续对话。";
        resultBox.classList.add("visible");
        targetNode.scrollIntoView({ behavior: "smooth", block: "nearest" });
      } else {
        resultBox.textContent = resultParts.length
          ? resultParts.join("\n")
          : "该回复结束当前对话。";
        resultBox.classList.add("visible");
      }

      restartButton.classList.add("visible");
    }

    function restartDialogue(tree) {
      if (!tree) {
        return;
      }

      const nodes = [...tree.querySelectorAll("[data-dialogue-node-id]")];
      nodes.forEach((node, index) => {
        node.hidden = index !== 0;
      });

      const history = tree.querySelector("[data-dialogue-history]");
      const resultBox = tree.querySelector("[data-dialogue-result]");
      const restartButton = tree.querySelector("[data-dialogue-restart]");

      if (history) {
        history.innerHTML = "";
      }

      if (resultBox) {
        resultBox.textContent = "";
        resultBox.classList.remove("visible");
      }

      if (restartButton) {
        restartButton.classList.remove("visible");
      }
    }

    function matchesSearch(values) {
      if (!state.searchText) {
        return true;
      }

      return values
        .filter((value) => value !== undefined && value !== null)
        .join(" ")
        .toLowerCase()
        .includes(state.searchText);
    }

    function getStatusLabel(status, value) {
      if (status === "done") {
        return {
          text: "已定稿",
          className: "done"
        };
      }

      if (status === "draft" && value.trim() !== "") {
        return {
          text: "草稿",
          className: "draft"
        };
      }

      return {
        text: "待补充",
        className: "todo"
      };
    }

    function renderProgress() {
      const fields = GAME_DOCUMENT.chapters.flatMap((chapter) => {
        return chapter.sections.flatMap((section) => section.fields);
      });

      const completed = fields.filter((field) => {
        const value = String(field.value || "").trim();
        const taskSegmentText = getTaskSegmentText(getTaskSegments(field));
        const dialogueText = getDialogueText(getDialogueLines(field));
        const rewardText = getRewardText(getRewardEntries(field, {}));

        return field.status !== "todo"
          && (value !== "" || taskSegmentText !== "" || dialogueText !== "" || rewardText !== "");
      });

      const percentage = fields.length === 0
        ? 0
        : Math.round((completed.length / fields.length) * 100);

      elements.progressText.textContent = `${percentage}%`;
      elements.progressBar.style.width = `${percentage}%`;
    }

          return `

      }
    }

    function getEntityName(id) {
      const allReputations = RELATION_DATA.reputations;
      const allNpcs = RELATION_DATA.npcs;
      const allQuests = RELATION_DATA.quests;
      const allFlags = RELATION_DATA.flags;
      const allBranches = RELATION_DATA.quests.flatMap((quest) => quest.branches);

      const found = [
        ...allReputations,
        ...allNpcs,
        ...allQuests,
        ...allFlags,
        ...allBranches
      ].find((item) => item.id === id);

      if (found) {
        return found.name;
      }

      const fallbackNames = {
        qingshi_reputation: "青石村声望",
        official_trust: "官府信任",
        village_npcs: "村镇 NPC 群体",
        dao_mainline: "道门主线",
        master_trial: "师门试炼",
        missing_girl: "失踪少女",
        village_shrine: "村祠异变",
        official_route: "官府路线",
        wanted_order: "通缉系统"
      };

      return fallbackNames[id] || id;
    }

    function observeActiveChapter() {
      if (state.observer) {
        state.observer.disconnect();
      }

      state.observer = new IntersectionObserver(
        (entries) => {
          if (Date.now() < state.navigationLockUntil) {
            return;
          }

          const visible = entries.some((entry) => entry.isIntersecting);

          if (visible) {
            syncActiveChapterFromViewport();
          }
        },
        {
          root: null,
          threshold: [0, 0.12, 0.32],
          rootMargin: "-12% 0px -68% 0px"
        }
      );

      document.querySelectorAll("[data-chapter]").forEach((chapter) => {
        state.observer.observe(chapter);
      });
    }

    function syncActiveChapterFromHash() {
      const chapterId = getChapterIdFromHash();

      if (chapterId) {
        setActiveChapter(chapterId);
        return;
      }

      syncActiveChapterFromViewport();
    }

    function getChapterIdFromHash() {
      const match = window.location.hash.match(/^#chapter-(.+)$/);

      if (!match) {
        return "";
      }

      return decodeURIComponent(match[1]);
    }

    function syncActiveChapterFromViewport() {
      if (Date.now() < state.navigationLockUntil) {
        return;
      }

      const chapters = [...document.querySelectorAll("[data-chapter]")];

      if (chapters.length === 0) {
        return;
      }

      const anchorLine = getReadingAnchorLine();
      const coveringChapter = chapters.find((chapter) => {
        const rect = chapter.getBoundingClientRect();
        return rect.top <= anchorLine && rect.bottom > anchorLine;
      });

      const current = coveringChapter || chapters.reduce((closest, chapter) => {
        const closestDistance = Math.abs(closest.getBoundingClientRect().top - anchorLine);
        const chapterDistance = Math.abs(chapter.getBoundingClientRect().top - anchorLine);
        return chapterDistance < closestDistance ? chapter : closest;
      }, chapters[0]);

      setActiveChapter(current.dataset.chapter);
    }

    function getReadingAnchorLine() {
      if (window.innerWidth > 900) {
        return 122;
      }

      const mobileHeaderHeight = elements.mobileHeader
        ? elements.mobileHeader.getBoundingClientRect().height
        : 0;
      const toolbarWrapHeight = elements.toolbarWrap
        ? elements.toolbarWrap.getBoundingClientRect().height
        : 0;

      return Math.ceil(mobileHeaderHeight + toolbarWrapHeight + 18);
    }

    function setActiveChapter(chapterId) {
      document.querySelectorAll("[data-chapter-link]").forEach((link) => {
        link.classList.toggle("active", link.dataset.chapterLink === chapterId);
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
